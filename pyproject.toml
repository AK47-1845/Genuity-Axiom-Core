[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genuity-axiom"
version = "0.3.0"
description = "Genuity Axiom: evidence-gated synthetic and rare-scenario data infrastructure for industrial AI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]
authors = [
    { name = "Genuity IO" }
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=8",
]

[project.scripts]
genuity-axiom = "genuity_axiom.cli:main"
pramana = "genuity_axiom.cli:main"

[tool.setuptools]
packages = ["genuity_axiom", "pramana"]
package-dir = { genuity_axiom = ".", pramana = "pramana" }

[tool.setuptools.package-data]
genuity_axiom = ["domain_packs/*.json"]
